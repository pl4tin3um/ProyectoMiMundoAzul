<link rel="icon" type="image/png" href="../assets/imgs/logo.png">
<script src="https://cdn.tailwindcss.com"></script>


<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'azul-fuerte': '#1B5E8C',
          'azul-oscuro': '#123A56',
          'azul-medio': '#2479A8',
          'azul-claro': '#4FA3D1',
          'azul-suave': '#B9DDF2',
          'cielo': '#EAF4FB',
          'cielo-medio': '#D5ECF8',
          'cielo-oscuro': '#C1E0F0',
          'sol': '#FFC857',
          'sol-claro': '#FFE29A',
          'sol-oscuro': '#E5A82F',
          'tinta': '#16324A',
          'tinta-suave': '#3F5A72',
          'tinta-clara': '#668197',
          'blanco': '#FFFFFF',

  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  /* ImageKit: sustituye none por url("https://ik.imagekit.io/TU_ID/imagen-fondo.webp"). */
  #pagina-formularios {
    --fondo-formularios: none;
    background-image: linear-gradient(rgba(234, 244, 251, .82), rgba(193, 224, 240, .9)), var(--fondo-formularios);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* ImageKit alternativo para pantallas pequeñas; reemplaza none por la URL optimizada para móvil. */
  @media (max-width: 640px) {
    #pagina-formularios {
      --fondo-formularios: none;
      background-attachment: scroll;
    }
  }

  .salto-contenido {
    position: absolute;
    left: 1rem;
    top: -5rem;
    z-index: 100;
    padding: .75rem 1rem;
    background: #fff;
    color: #123A56;
    border: 2px solid #123A56;
    border-radius: .75rem;
  }
  .salto-contenido:focus { top: 1rem; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
  }
</style>
</head>

<body class="bg-cielo text-tinta font-nunito antialiased" id="pagina-formularios">
  <a class="salto-contenido" href="#contenido-principal">Saltar al contenido principal</a>
  <div id="header"></div>

  <!-- ================= CONTENIDO PRINCIPAL DE ESTA PÁGINA ================= -->
  <main id="contenido-principal" class="min-h-[70vh] bg-cielo-oscuro/90 py-12" tabindex="-1">
    <section class="px-[6vw] py-12 max-w-6xl mx-auto" id="seccion-formularios">
  <div class="max-w-2xl mx-auto text-center mb-10">
    <span class="inline-block bg-white text-azul-fuerte text-sm font-bold px-4 py-1.5 rounded-full">Comunidad</span>
    <h1 class="font-baloo font-extrabold text-3xl text-azul-oscuro mt-3">Formularios Disponibles</h1>
    <p class="text-tinta-suave mt-2">Completa los formularios de Google fácilmente.</p>
  </div>

  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" id="gridFormularios" aria-live="polite" aria-label="Formularios disponibles">
  </div>
</section>

<div id="modalFormulario" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" aria-hidden="true">
  <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-cielo">
      <h3 id="modalTitulo" class="font-baloo font-bold text-lg text-azul-oscuro">Formulario</h3>
      <button type="button" id="btnCerrarModal" class="text-tinta-suave hover:text-rojo text-2xl font-bold" aria-label="Cerrar formulario">&times;</button>
    </div>
    <div class="p-2 flex-1 overflow-hidden">
      <iframe id="iframeModal" src="" title="Formulario de Google" class="w-full h-full min-h-[500px] border-0 rounded-b-2xl"></iframe>
    </div>
  </div>
</div>
  </main>

<div id="footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
