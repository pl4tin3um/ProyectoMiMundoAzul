<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'azul-fuerte': '#1B5E8C',
            'azul-oscuro': '#123A56',
            'azul-medio': '#2479A8',
            'azul-claro': '#4FA3D1',
            'azul-suave': '#B9DDF2',
            'cielo': '#EAF4FB',
            'cielo-medio': '#D5ECF8',
            'cielo-oscuro': '#C1E0F0',
            'sol': '#FFC857',
            'sol-claro': '#FFE29A',
            'sol-oscuro': '#E5A82F',
            'tinta': '#16324A',
            'tinta-suave': '#3F5A72',
            'tinta-clara': '#668197',
            'blanco': '#FFFFFF',
            'gris-claro': '#F3F6F8',
            'gris': '#D9E1E6',
            'gris-oscuro': '#8A9AA8',
            'verde': '#4CAF7D',
            'verde-claro': '#D9F2E5',
            'rojo': '#D95C5C',
            'rojo-claro': '#F8DADA',
            'morado': '#7569A8',
            'morado-claro': '#E5E1F3',
            'morado-oscuro': '#4B3D7A',
            'morado-medio': '#8C7FC1'
          },
          fontFamily: {
            baloo: ['"Baloo 2"', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '1.75rem'
          }
        }
      }
    };
  </script>

  <!-- CSS Personalizado e Iconos7 -->
  <link rel="stylesheet" href="../Assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-cielo text-tinta font-nunito antialiased" id="pagina-formularios">


  <div class="flex items-center justify-between gap-4 flex-wrap px-[5vw] py-5 bg-azul-suave shadow-sm sticky top-0 z-40 border-4 border-azul-fuerte rounded-3xl">
    <div class="flex items-center gap-3">
      <img src="../Assets/Imgs/Logo.jpeg" alt="Mi Mundo Azul" class="w-11 h-11 rounded-full object-cover">
      <div class="font-baloo font-bold leading-tight">
        Mi Mundo Azul
        <small class="block font-nunito font-normal text-tinta-suave text-sm">Asociación Autista de flores</small>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="absolute left-1/2 -translate-x-1/2 font-baloo font-bold text-lg whitespace-nowrap">Formularios</div>
    </div>
      <button class="boton--claro boton--chico" id="btnirIndex" onclick="window.location.href='../index.html'">
            <i class="bi bi-box-arrow-right"></i>
        Salir
      </button>
    </div>
  </div>

  <!-- ================= CONTENIDO PRINCIPAL DE ESTA PÁGINA ================= -->
  <main class="min-h-[70vh] bg-cielo-oscuro py-12">
    <section class="px-[6vw] py-12 max-w-6xl mx-auto" id="seccion-formularios">
  <div class="max-w-2xl mx-auto text-center mb-10">
    <span class="inline-block bg-white text-azul-fuerte text-sm font-bold px-4 py-1.5 rounded-full">Comunidad</span>
    <h2 class="font-baloo font-extrabold text-3xl text-azul-oscuro mt-3">Formularios Disponibles</h2>
    <p class="text-tinta-suave mt-2">Completa los formularios de Google fácilmente.</p>
  </div>

  <!-- Grid donde se renderizan las Cards -->
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" id="gridFormularios">
    <!-- Las cards se cargarán aquí dinámicamente -->
  </div>
</section>

<!-- Modal para responder el formulario cargado -->
<div id="modalFormulario" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-cielo">
      <h3 id="modalTitulo" class="font-baloo font-bold text-lg text-azul-oscuro">Formulario</h3>
      <button id="btnCerrarModal"class="text-tinta-suave hover:text-rojo text-2xl font-bold">&times;</button>
    </div>
    <div class="p-2 flex-1 overflow-hidden">
      <iframe id="iframeModal" src="" class="w-full h-full min-h-[500px] border-0 rounded-b-2xl"></iframe>
    </div>
  </div>
</div>
  </main>

  <footer class="text-center py-8 text-cielo text-sm bg-azul-fuerte ">
    <p>© <span id="anioFooter"></span> Mi Mundo Azul · Asociación civil.</p>
  </footer>
</body>
  <script src="../Assets/js/common.js"></script>
  <script src="../Assets/js/formularios.js"></script>
</html>
